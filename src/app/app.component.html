<div class="container">
  <h1>JSON Diff Viewer</h1>
  
  <div class="json-inputs">
    <div class="json-input">
      <h3>Original JSON</h3>
      <textarea [(ngModel)]="json1" rows="10"></textarea>
    </div>
    
    <div class="json-input">
      <h3>Modified JSON</h3>
      <textarea [(ngModel)]="json2" rows="10"></textarea>
    </div>
  </div>

  <div class="diff-viewer-tabs">
    <button 
      [class.active]="activeTab === 'line'"
      (click)="activeTab = 'line'">
      Line View
    </button>
    <button 
      [class.active]="activeTab === 'table'"
      (click)="activeTab = 'table'">
      Table View
    </button>
  </div>

  <div class="diff-viewer-content">
    <div *ngIf="activeTab === 'line'">
      <app-json-diff-viewer 
        [oldJson]="json1"
        [newJson]="json2">
      </app-json-diff-viewer>
    </div>
    <div *ngIf="activeTab === 'table'">
      <app-table-json-diff-viewer
        [oldJson]="json1"
        [newJson]="json2"
        autoExpand="changed">
      </app-table-json-diff-viewer>
    </div>
  </div>
</div>
