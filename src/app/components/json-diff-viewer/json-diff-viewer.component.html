<div class="json-diff-container">
  <div class="json-panel old">
    <h3>Original JSON</h3>
    <pre class="line-numbers"><code><ng-container *ngFor="let line of oldJsonLines; let i = index"><div class="line" [class.changed]="line.changed" [attr.data-line]="i + 1" [ngClass]="line.type">{{ line.content }}</div></ng-container></code></pre>
  </div>

  <div class="json-panel new">
    <h3>Modified JSON</h3>
    <pre class="line-numbers"><code><ng-container *ngFor="let line of newJsonLines; let i = index"><div class="line" [class.changed]="line.changed" [attr.data-line]="i + 1" [ngClass]="line.type">{{ line.content }}</div></ng-container></code></pre>
  </div>
</div>
