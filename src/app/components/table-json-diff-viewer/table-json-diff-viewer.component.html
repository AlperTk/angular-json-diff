<div class="json-diff-table-container">
  <table class="diff-table">
    <thead>
      <tr>
        <th>Path</th>
        <th *ngIf="showOriginalColumn">Original Value</th>
        <th *ngIf="showModifiedColumn">Modified Value</th>
        <th>Change Type</th>
      </tr>
    </thead>
    <tbody>
      <ng-container *ngFor="let diff of diffResults; let i = index">
        <tr [ngClass]="diff.type">
          <td class="path-cell">
            <span *ngIf="isExpandable(diff)" (click)="toggleExpand(i)" class="expand-toggle">
              <span *ngIf="!isExpanded(i)">▶</span>
              <span *ngIf="isExpanded(i)">▼</span>
            </span>
            {{ diff.path }}
          </td>
          <td *ngIf="showOriginalColumn" class="value-cell" [ngClass]="{
            'removed': diff.type === 'removed',
            'modified': diff.type === 'modified'
          }">
            <ng-container *ngIf="diff.oldValue !== undefined">
              <ng-container *ngIf="isExpandableValue(diff.oldValue); else simpleOld">
                <span class="expandable-label">Object/List</span>
              </ng-container>
              <ng-template #simpleOld>
                <pre>{{ diff.oldValue | json }}</pre>
              </ng-template>
            </ng-container>
            <span *ngIf="diff.oldValue === undefined" class="empty-value">Empty</span>
          </td>
          <td *ngIf="showModifiedColumn" class="value-cell" [ngClass]="{
            'added': diff.type === 'added',
            'modified': diff.type === 'modified'
          }">
            <ng-container *ngIf="diff.newValue !== undefined">
              <ng-container *ngIf="isExpandableValue(diff.newValue); else simpleNew">
                <span class="expandable-label">Object/List</span>
              </ng-container>
              <ng-template #simpleNew>
                <pre>{{ diff.newValue | json }}</pre>
              </ng-template>
            </ng-container>
            <span *ngIf="diff.newValue === undefined" class="empty-value">Empty</span>
          </td>
          <td class="type-cell">
            <span class="change-badge">{{ diff.type }}</span>
          </td>
        </tr>
        <tr *ngIf="isExpanded(i) && isExpandable(diff)">
          <td colspan="4" class="expanded-cell">
            <app-table-json-diff-viewer
              [oldJson]="getSubJson(diff.oldValue)"
              [newJson]="getSubJson(diff.newValue)"
              [autoExpand]="autoExpand">
            </app-table-json-diff-viewer>
          </td>
        </tr>
      </ng-container>
    </tbody>
  </table>
</div>
